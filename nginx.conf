user root;
worker_processes 1;

events {
}

http {
    server {
        listen 80;
        listen 443 ssl;
        server_name www.configuration.vneshpromtorg.com;

        location / {
            proxy_pass http://angular:81/;
        }

        location /inner/ {
            proxy_pass http://adminka:80/;
        }

        location /api/v1/ {
            proxy_pass http://spring:8080/api/v1/;
        }

        location /inner/api/v1/ {
            proxy_pass http://spring:8080/api/v1/;
        }
        location /.well-known/acme-challenge/ { root /var/www/certbot; }

        ssl_certificate /etc/letsencrypt/live/www.configuration.vneshpromtorg.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.configuration.vneshpromtorg.com/privkey.pem;
    }
}
